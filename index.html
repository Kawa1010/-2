<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鬼ごっこスター - 恐怖の追跡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>👹 鬼の館 - STAR ESCAPE 👹</h1>
      <div id="hud">
        <div class="hud-item">集めた星: <span id="score">0</span> / <span id="target-score">10</span></div>
        <div class="hud-item">
          スタミナ:
          <div id="stamina-bar-bg">
            <div id="stamina-bar"></div>
          </div>
        </div>
      </div>
    </header>

    <div id="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="550"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">鬼から逃げ切れ</h2>
        <p id="overlay-desc">暗闇に潜む鬼から逃げながら、星を10個集めろ。</p>
        <button id="start-btn">ゲーム開始（音が出ます）</button>
      </div>
    </div>

    <footer>
      <p>移動: <strong>WASD</strong> または <strong>矢印キー</strong> ｜ ダッシュ: <strong>Shift</strong>（スタミナ消費）</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
